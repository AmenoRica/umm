<style>
@font-face { font-family: "Brand Barlow"; src: url(brand-barlow.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: Kakao; src: url(kakao.woff2); font-weight: 700; font-display: swap; }
@font-face { font-family: Pretendard; src: url(pretendard.woff2); font-weight: 100 900; font-display: swap; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh;
  background-color: #e9ebef;
  background-image: radial-gradient(circle, #101a3226 .85px, transparent 1px);
  background-size: 12px 12px;
  color: #101a32; font-family: Pretendard, system-ui, sans-serif; }
main { max-width: 1500px; margin: auto; padding: clamp(20px,4vw,64px); }
h1 { margin: 0 0 clamp(18px,3vw,40px); display: flex; flex-direction: column; align-items: flex-start; gap: .18em; font-size: clamp(21px,2.6vw,36px); letter-spacing: -.04em; }
.wordmark { display: inline-flex; align-items: center; gap: .215385em; font: 400 1em/1.1 "Brand Barlow", sans-serif; letter-spacing: -.055em; }
.wordmark svg { height: 1.1em; width: .384615em; fill: currentColor; }
h1 small { font-size: .48em; font-weight: 550; letter-spacing: 0; }
nav { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
a { position: relative; isolation: isolate; overflow: hidden; container-type: inline-size; display: grid; grid-template-rows: 1fr auto; min-height: clamp(300px,49svh,490px); color: inherit; background: #f4f4f4; text-decoration: none; }
a:focus-visible { outline: 4px solid #426bea; outline-offset: 3px; }
.caption { display: flex; align-items: center; justify-content: space-between; margin: 0 7% 6%; padding-top: .85em; border-top: 1px solid currentColor; font-size: clamp(19px,4.7cqw,34px); font-weight: 700; }
.credit { display: block; margin-top: .3em; font-size: .55em; font-weight: 500; }
.arrow { font: normal 1.15em system-ui; }
.scene { align-self: center; justify-self: center; position: relative; width: 80%; }
.umm { font-family: Kakao, system-ui, sans-serif; }
.voice { display: flex; align-items: center; justify-content: center; }
.voice svg { width: 42%; }
.voice b { font-size: 32cqw; line-height: 1; }
.bar { display: grid; grid-template-columns: 3fr 4fr 2fr; margin: 2% 6% 0; border: 2px solid; }
.bar span { text-align: center; font-size: 4cqw; line-height: 1.5; }
.bar span + span { border-left: 2px solid; }
.bar span:first-child { background: #101a32; color: #f4f4f4; }
.yoi { background: #10182e; color: #e5e8ef; }
.flow { position: absolute; inset: -192px 0 0; width: 100%; height: calc(100% + 192px); z-index: -1; }
.trail { display: flex; justify-content: center; align-items: baseline; font-size: 20cqw; font-weight: 870; line-height: 1; letter-spacing: -.09em; }
.wave { display: inline-block; width: 1.16em; overflow: hidden; white-space: nowrap; }
.finish { color: #75aaff; }
@media (prefers-reduced-motion: no-preference) {
  .yoi:is(:hover,:focus-visible) .flow { animation: fall 2s linear infinite; }
  .yoi:is(:hover,:focus-visible) .wave { animation: stretch 1.7s ease-in-out infinite alternate; }
  .umm:is(:hover,:focus-visible) .voice b { animation: speak 1.3s ease-in-out infinite; }
  .umm:is(:hover,:focus-visible) .bar span { animation: fill 1.8s steps(1) infinite; }
  .umm .bar span:nth-child(2) { animation-delay: .6s; }
  .umm .bar span:nth-child(3) { animation-delay: 1.2s; }
}
@keyframes fall { to { transform: translateY(192px); } }
@keyframes stretch { from { width: .58em; } to { width: 1.7em; } }
@keyframes speak { 50% { transform: translate(3%,-3%) rotate(-3deg); } }
@keyframes fill { 0%,100% { background: #101a32; color: #f4f4f4; } 33% { background: #f4f4f4; color: #101a32; } }
@media (min-width: 681px) {
  .umm .scene { width: min(76%, 400px); }
  .voice b { font-size: min(26cqw, 153px); }
  .bar span { font-size: min(3.5cqw, 22px); }
}
@media (max-width: 680px) {
  nav { grid-template-columns: 1fr; }
  a { min-height: clamp(225px,35svh,340px); }
  .scene { width: 68%; }
  .voice b { font-size: 24cqw; }
  .trail { font-size: 17cqw; }
  .caption { margin-bottom: 4%; }
}
</style>
