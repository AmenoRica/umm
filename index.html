    :root {
      background: #f4f4f4;
      color: #101a32;
      font-family: "Kakao Big Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
    }
    .stage {
      --result-gap: clamp(68px, 11svh, 102px);
      --face-width: clamp(100px, 15vw, 202px);
      display: grid;
      justify-items: center;
      position: relative;
      width: 100%;
    }
    [hidden] { display: none !important; }
    .menu { text-align: center; }
    .menu h1 { margin: 0 0 2rem; font-size: clamp(2rem, 7vw, 4rem); }
    .menu p { font-size: 1.35rem; margin: 0 0 1rem; }
    .menu button {
      font: inherit;
      font-weight: 700;
      background: #101a32;
      color: #f4f4f4;
      padding: .8rem 1.8rem;
      border: 0;
      border-radius: 2rem;
      cursor: pointer;
    }
    .clock {
      position: absolute;
      top: calc(100% + .65rem);
      font-variant-numeric: tabular-nums;
      font-size: 1.25rem;
    }
    .bar {
      position: relative;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      --base-width: min(42rem, calc(100vw - 3rem), 82vw);
      width: calc((var(--base-width) - 4px) * var(--scale, 1) + 4px);
      height: clamp(3rem, 7vw, 4rem);
      border: 2px solid currentColor;
    }
    .bar span {
      position: relative;
      display: grid;
      place-items: center;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1;
    }
    .bar span + span { border-inline-start: 2px solid currentColor; }
    .bar::before {
      content: "";
      position: absolute;
      left: var(--marker, calc(100% / 6));
      bottom: calc(100% + 16px);
      width: 14px;
      height: 14px;
      border: solid currentColor;
      border-width: 0 3px 3px 0;
      transform: translateX(-50%) rotate(45deg);
      transition: left 220ms cubic-bezier(.22,.75,.25,1);
    }
    .result {
      position: absolute;
      bottom: calc(100% + var(--result-gap));
      justify-self: center;
      font-size: min(7rem, 18svh, calc(88vw / var(--letters, 1)));
      text-align: center;
      white-space: nowrap;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }
    .caption {
      position: absolute;
      bottom: calc(100% + 32px);
      max-width: 94vw;
      text-align: center;
      font-size: clamp(.75rem, 2.8vw, .9rem);
    }
    .history {
      position: fixed;
      inset: 4svh 4vw;
      display: grid;
      place-items: center;
      grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
      grid-template-rows: repeat(var(--rows, 1), minmax(0, 1fr));
      font-weight: 700;
      font-size: min(4.5rem, calc(86vw / var(--cols, 1) / var(--longest, 1)), calc(64svh / var(--rows, 1)));
      pointer-events: none;
    }
    .history span { white-space: nowrap; }
    #sound-toggle { display: block; margin: .7rem auto 0; padding: .65rem 1rem; background: transparent; color: inherit; font-size: .95rem; }
    #summary { position: relative; box-sizing: border-box; max-height: 100svh; overflow-y: auto; padding: 1rem 0 2.75rem; }
    #summary h1 { font-size: 1.1rem; margin: 0 0 .8rem; }
    #grade { display: block; font-size: clamp(3.5rem, 10svh, 5.25rem); line-height: 1; }
    #verdict { margin: .65rem 1rem 1.65rem; font-size: clamp(.95rem, 3vw, 1.1rem); line-height: 1.45; word-break: keep-all; }
    .stats { display: flex; justify-content: center; gap: 2.25rem; margin-bottom: 1.65rem; }
    .stats p { font-size: .9rem; margin: 0; }
    .stats strong { display: block; margin-top: .2rem; font-size: 1.65rem; }
    #criteria-button { margin-top: .4rem; font-size: .9rem; color: inherit; background: transparent; }
    #criteria { border: 2px solid; padding: 2rem; color: #101a32; background: #f4f4f4; }
    #criteria::backdrop { background: #101a3255; }
    #criteria table { border-spacing: 0 .45rem; }
    #criteria th { text-align: left; padding-right: 2rem; }
    #criteria td { text-align: right; font-variant-numeric: tabular-nums; }
    #criteria button { position: absolute; top: 0; right: 0; width: 2rem; height: 2rem; border: 0; font: inherit; font-size: 1.4rem; color: inherit; background: transparent; cursor: pointer; }
    .result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .65rem; padding: 0 1rem; }
    .share { border: 2px solid currentColor; border-radius: 2rem; padding: .7rem 1.3rem; color: inherit; text-decoration: none; }
    .brand { position: fixed; right: max(1rem, env(safe-area-inset-right)); bottom: max(.5rem, env(safe-area-inset-bottom)); min-height: 40px; display: inline-flex; align-items: center; gap: .215385em; color: inherit; text-decoration: none; font: 400 19px/1.1 "Brand Barlow", sans-serif; letter-spacing: -.055em; }

<body>
  <main class="menu" id="home">
    <h1>이번 엄은 다르다</h1>
    <button id="start" type="button">시작하기</button>
    <button id="sound-toggle" type="button" role="switch" aria-label="게임 소리" aria-checked="false">소리 꺼짐</button>
  </main>
  <main class="stage" aria-label="엄 리듬 바" hidden>
    <div class="face" aria-hidden="true">
      <svg viewBox="0 -12 150 168" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path id="face-outline" fill="#f4f4f4"/>
        <path d="M65 11 C66 2 59 -7 50 -7"/>
        <path d="M88 46 Q99 43 108 45 M53 74 Q41 65 39 77 Q38 85 47 88 M44 77 Q50 75 50 81"/>
        <g class="face-eyes" fill="currentColor" stroke="none">
          <ellipse cx="105" cy="55" rx="2.8" ry="4.4"/>
        </g>
        <path id="face-mouth" fill="currentColor"/>
      </svg>
    </div>
    <div class="bar">
      <span aria-current="step">ㅇ</span><span>ㅓ</span><span>ㅁ</span>
    </div>
    <div class="result" aria-live="polite" aria-atomic="true"><div class="combo"></div><div class="word"></div><div class="score"></div></div>
    <div class="caption" aria-live="polite"></div>
    <div class="clock" role="timer" aria-label="남은 시간">30.000</div>
    <div class="pads" role="group" aria-label="리듬 입력">
      <button type="button">ㅇ</button><button type="button">ㅓ</button><button type="button">ㅁ</button>
    </div>
  </main>
  <div class="history" aria-hidden="true" hidden></div>
  <main class="menu" id="summary" hidden>
    <h1>게임 종료</h1>
    <strong id="grade"></strong>
    <p id="verdict"></p>
    <div class="stats">
      <p>총 점수 <strong id="points">0점</strong></p>
      <p>최대 콤보 <strong id="best">0</strong></p>
    </div>
    <div class="result-actions">
      <button id="replay" type="button">다시하기</button>
      <a id="share" class="share" target="_blank" rel="noopener noreferrer">트위터에 결과 공유</a>
    </div>
    <button id="criteria-button" type="button" aria-haspopup="dialog">등급 산출 기준</button>
    <a class="brand" href="https://ameno.cc/" aria-label="AmenoRica 홈페이지">
      <svg viewBox="0 0 17.5 100" preserveAspectRatio="none" aria-hidden="true"><rect x="0" y="20" width="1" height="60"/><rect x="5.5" y="0" width="1" height="100"/><rect x="11" y="40" width="1" height="60"/><rect x="16.5" y="60" width="1" height="40"/></svg>AmenoRica
    </a>
  </main>
  <dialog id="criteria" aria-label="등급 산출 기준">
    <form method="dialog"><button aria-label="닫기">×</button></form>
    <table aria-label="등급별 점수대"><tbody></tbody></table>
  </dialog>
  <script>
    let cells = [...document.querySelectorAll(".bar span")];
    const labels = cells.map(cell => cell.textContent);
    const keys = ["KeyD", "KeyJ", "KeyA"];
    const bar = document.querySelector(".bar");
    const result = document.querySelector(".result");

    function formatWord(held) {
      const [longest, second] = [...held].sort((a, b) => b - a);
      const extra = Math.min(4, Math.floor((longest - second) / 300));
      if (!extra) return "엄";
      switch (held.indexOf(longest)) {
        case 0: return "ㅇ".repeat(extra) + "엄";
        case 1: return "어" + "ㅓ".repeat(extra) + "ㅁ";
        default: return "엄" + "…".repeat(extra);
      }
    }

    function scoreRound(held, targets) {
      const judgementWindowMs = 700;
      const error = held.reduce((sum, ms, i) =>
        sum + Math.min(1, Math.abs(ms - targets[i]) / judgementWindowMs), 0);
      const accuracy = 100 * (1 - error / targets.length);
      if (accuracy <= 80 + 1e-9) return 0;
      if (accuracy >= 96 - 1e-9) return 100;
      return Math.min(99, Math.round(70 + (accuracy - 80) * 30 / 16));
    }

    function resultWord(held, score) {
      if (score === 0) return "…";
      const word = formatWord(held);
      if (score === 100) return word + "!";
      if (score <= 80) return word + "?";
      return word;
    }

    function showResult(word, score, streak, multiplier, earned) {
      if (result.textContent) {
        const previous = result.cloneNode(true);
        previous.removeAttribute("aria-live");
        previous.setAttribute("aria-hidden", "true");
        result.before(previous);
        previous.animate([
          { transform: "translate(0, 0) rotate(0deg)" },
          { transform: "translate(-4px, 5px) rotate(-4deg)", offset: 0.15 },
          { transform: "translate(55vw, -55svh) rotate(32deg)" }
        ], { duration: 300, easing: "ease-in" }).finished.then(() => previous.remove());
      }
      result.style.setProperty("--letters", word.length);
      const wordNode = result.querySelector(".word");
      wordNode.textContent = word;
      result.querySelector(".combo").textContent = streak >= 3 ? streak + " 콤보" : "";
      if (streak) {
        wordNode.animate([
          { textShadow: "0 0 0 transparent" },
          { textShadow: "0 0 9px #101a3266", offset: .35 },
          { textShadow: "0 0 0 transparent" }
        ], { duration: 380, easing: "ease-out" });
      }
      result.querySelector(".score").textContent = multiplier === 1
        ? score + "점" : score + " × " + multiplier + " = " + earned + "점";
      if (score > 0) {
        const lips = mouth.getBoundingClientRect();
        const target = wordNode.getBoundingClientRect();
        const dx = lips.right - (target.left + target.width / 2);
        const dy = lips.top - (target.top + target.height / 2);
        wordNode.animate([
          { transform: `translate(${dx}px, ${dy}px) scale(.09) rotate(-8deg)` },
          { transform: `translate(${dx * .43}px, ${dy * .43 - 12}px) scale(.58) rotate(-4deg)`, offset: .42 },
          { transform: "translate(2px, -2px) scale(1.05)", offset: .82 },
          { transform: "none" }
        ], { duration: 310, easing: "ease-out" });
      }
    }
    const baseHold = 700;
    const baseTotal = keys.length * baseHold;
    let durations = keys.map(() => baseHold);
    let order = [0, 1, 2];
    let held = [0, 0, 0];
    let round = 1;
    let combo = 0;
    let total = baseTotal;
    let index = 0;
    let started = null;
    let inputOwner = null;
    const pads = [...document.querySelectorAll(".pads button")];
    let frame;
    const stage = document.querySelector(".stage");
    const clock = document.querySelector(".clock");
    let playing = false;
    let deadline = 0;
    let points = 0;
    let bestCombo = 0;
    const words = [];
    const captions = [
      "이번 엄은 다르다.",

    function playEom() {
      if (!soundEnabled || !sample) return;
      const voice = audioContext.createBufferSource();
      voice.buffer = sample;
      voice.playbackRate.value = 2 ** ((Math.random() * 2 - 1) / 12);
      voice.connect(audioContext.destination);
      voice.onended = () => voice.disconnect();
      voice.start();
    }
    const grades = [
      { min: 0, rank: "C", text: "어까지는 들렸다." },
      { min: 475, rank: "B", text: "엄이긴 했다." },
      { min: 950, rank: "A", text: captions[0] },
      { min: 1700, rank: "S", text: captions[1] },
      { min: 2400, rank: "SS", text: captions[2] },
      { min: 3050, rank: "SS+", text: "이번 엄은 확실히 다르다." }
    ];
    const criteria = document.querySelector("#criteria");
    const rangeTable = criteria.querySelector("tbody");
    grades.forEach((grade, i) => {
      const row = rangeTable.insertRow();
      const label = document.createElement("th");
      label.scope = "row";
      label.textContent = grade.rank;
      row.append(label);
      const lower = grade.min.toLocaleString("ko-KR");
      const next = grades[i + 1];
      row.insertCell().textContent = next
        ? lower + "–" + (next.min - 1).toLocaleString("ko-KR") + "점"
        : lower + "점 이상";
    });
    document.querySelector("#criteria-button").addEventListener("click", () => criteria.showModal());

    async function revealSummary() {
      if (words.length) {
        const wall = document.querySelector(".history");
        const longest = words.reduce((n, word) => Math.max(n, word.length), 1);
        const cols = Math.min(words.length, Math.ceil(Math.sqrt(words.length * innerWidth / innerHeight / longest)));
        wall.style.setProperty("--cols", cols);
        wall.style.setProperty("--rows", Math.ceil(words.length / cols));
        wall.style.setProperty("--longest", longest);
        wall.hidden = false;
        const interval = Math.min(75, 850 / words.length);
        let last;
        words.forEach((word, i) => {
          const item = document.createElement("span");
          item.textContent = word;
          wall.append(item);
          last = item.animate([
            { opacity: 0, transform: "translateY(.3em)" },
            { opacity: 1, transform: "none" }
          ], { duration: 220, delay: i * interval, fill: "backwards", easing: "ease-out" });
        });
        await last.finished;
        await wall.animate([{ opacity: 1 }, { opacity: .13 }], {
          delay: 180, duration: 320, fill: "forwards"
        }).finished;
      }
      const summary = document.querySelector("#summary");
      summary.hidden = false;
      summary.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180 });
      document.querySelector("#replay").focus();
    }

    function timeAvailable() {
      if (!playing) return false;
      if (performance.now() < deadline) return true;
      playing = false;
      cancelAnimationFrame(frame);
      started = null;
      inputOwner = null;
      stage.hidden = true;
      document.querySelector("#points").textContent = points + "점";
      document.querySelector("#best").textContent = bestCombo;
      const grade = grades.findLast(entry => points >= entry.min);
      document.querySelector("#grade").textContent = grade.rank;
      document.querySelector("#verdict").textContent = grade.text;
      const shareUrl = new URL("https://twitter.com/intent/tweet");
      const siteLink = "https://umm.ameno.cc/";
      shareUrl.searchParams.set("text", `#이번_엄은_다르다 이번 엄은 ${points}점, ${bestCombo}콤보. ${grade.rank}등급. ${grade.text}\n${siteLink}`);
      document.querySelector("#share").href = shareUrl.href;
      revealSummary();
      return false;
    }

    function tickClock() {
      if (!timeAvailable()) return;
      clock.textContent = (Math.max(0, Math.ceil(deadline - performance.now())) / 1000).toFixed(3);
      requestAnimationFrame(tickClock);
    }

    document.querySelector("#start").addEventListener("click", () => {
      if (playing) return;
      document.querySelector("#home").hidden = true;
      stage.hidden = false;
      deadline = performance.now() + 30000;
      playing = true;
      tickClock();
    });
    document.querySelector("#replay").addEventListener("click", () => {
      document.querySelector("#summary").hidden = true;
      const wall = document.querySelector(".history");
      wall.hidden = true;
      wall.getAnimations().forEach(animation => animation.cancel());
      wall.replaceChildren();
      words.length = 0;
      points = bestCombo = combo = successes = 0;
      round = 0;
      result.querySelectorAll(".combo, .word, .score").forEach(node => { node.textContent = ""; });
      document.querySelector(".caption").textContent = "";
      pads.forEach(pad => pad.classList.remove("held"));
      bar.classList.remove("changing");
      startRound();
      cells[0].setAttribute("aria-current", "step");
      document.querySelector("#start").click();
    });

    for (const cell of cells) cell.dataset.label = cell.textContent;

    function moveMarker(step) {
      const before = durations.slice(0, step).reduce((sum, ms) => sum + ms, 0);
      bar.style.setProperty("--marker", (before + durations[step] / 2) / total * 100 + "%");
    }

    function startRound() {
      if (round === 0) {
        durations = keys.map(() => baseHold);
        total = baseTotal;
      } else do {
        durations = keys.map(() => baseHold / 2 + Math.floor(Math.random() * (baseHold + 1)));
        total = durations.reduce((sum, ms) => sum + ms, 0);
      } while (total < baseTotal * .8 || total > baseTotal * 1.2);
      round++;
      order = [0, 1, 2];
      if (round === 3 || (round > 3 && Math.random() < .1)) {
        const split = Math.floor(Math.random() * order.length);
        const half = durations[split] / 2;
        durations.splice(split, 1, half, half);
        order.splice(split, 0, order[split]);
      }
      held = order.map(() => 0);
      cells = order.map(letter => {
        const cell = document.createElement("span");
        cell.textContent = labels[letter];
        cell.dataset.label = labels[letter];
        return cell;
      });
      bar.replaceChildren(...cells);
      bar.style.gridTemplateColumns = durations.map(ms => ms + "fr").join(" ");
      bar.style.setProperty("--scale", total / baseTotal);
      index = 0;
      moveMarker(index);
    }

    function paint() {
      const elapsed = performance.now() - started;
      const target = durations[index];
      poseFace(order[index], Math.min(1, elapsed / target));
      const remaining = Math.max(0, 1 - elapsed / target);
      const heat = Math.min(1, Math.max(0, (elapsed - target) / 400));
      cells[index].style.setProperty("--remaining", 100 * remaining + "%");
      cells[index].style.setProperty("--heat", 100 * heat + "%");
      return heat;
    }

    const outline = document.querySelector("#face-outline");
    const mouth = document.querySelector("#face-mouth");
    const eyes = document.querySelector(".face-eyes");
    function poseFace(letter, amount) {
      const puff = letter === 0 ? 12 * amount : 0;
      const jaw = letter === 1 ? 4 + 18 * amount : 0;
      // The nose and upper lip stay still while the cheek swells and the jaw drops.
      outline.setAttribute("d", `M26 85 C8 54 22 19 54 13 C81 7 107 17 112 40 Q113 56 128 68 Q132 73 118 76 Q116 81 119 85 L116 89 Q${120+puff} ${94+jaw} ${114+puff} ${106+jaw} Q110 ${125+jaw} 94 ${124+jaw} Q61 ${123+jaw} 39 102 Q31 96 26 85Z`);
      mouth.setAttribute("d", `M95 88 Q105 90 117 86 Q114 ${92+jaw} 106 ${91+jaw*.75} Q99 ${90+jaw*.35} 95 88Z`);
    }
    poseFace(2, 0);

    function reactFace(score) {
      poseFace(2, 0);
      if (score === 0) {
        eyes.animate([{ transform: "scaleY(1)" }, { transform: "scaleY(.1)" }, { transform: "scaleY(1)" }], { duration: 230 });
      } else {
        outline.animate([{ transform: "scaleY(1)" }, { transform: "scaleY(1.035)" }, { transform: "scaleY(.986)" }, { transform: "scaleY(1)" }], { duration: 235, easing: "ease-out" });
      }
    }

    async function changeRound() {
      bar.classList.add("changing");
      const open = "inset(-40px 0 0 0)";
      const closed = "inset(-40px 100% 0 0)";
      await bar.animate({ clipPath: [open, closed] }, {
        duration: 180, easing: "ease-in"
      }).finished;
      startRound();
      await bar.animate({ clipPath: [closed, open] }, {
        duration: 320, easing: "ease-out"
      }).finished;
      cells[0].setAttribute("aria-current", "step");
      bar.classList.remove("changing");
    }

    function animate() {
      if (paint() < 1) frame = requestAnimationFrame(animate);
    }

    function beginHold(letter, owner) {
      if (!timeAvailable()) return false;
      if (started !== null || letter !== order[index] || bar.classList.contains("changing")) return false;
      inputOwner = owner;
      pads[letter].classList.add("held");
      started = performance.now();
      animate();
      return true;
    }

    window.addEventListener("keydown", event => {
      if (event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
      const letter = ["Space", "Enter"].includes(event.code) ? pads.indexOf(event.target) : keys.indexOf(event.code);
      if (beginHold(letter, event.code)) event.preventDefault();
    });

    pads.forEach((pad, letter) => {
      pad.addEventListener("pointerdown", event => {
        if (event.button !== 0 || !beginHold(letter, event.pointerId)) return;
        event.preventDefault();
        pad.setPointerCapture(event.pointerId);
      });
      for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
        pad.addEventListener(type, event => {
          if (event.pointerId === inputOwner) finishHold();
        });
      }
      pad.addEventListener("contextmenu", event => event.preventDefault());
    });

    function finishHold() {
      if (started === null || !timeAvailable()) return;
      cancelAnimationFrame(frame);
      held[index] = performance.now() - started;
      paint();
      started = null;
      inputOwner = null;
      pads[order[index]].classList.remove("held");
      cells[index].removeAttribute("aria-current");
      index++;
      if (index === cells.length) {
        const score = scoreRound(held, durations);
        reactFace(score);
        const letterTimes = [0, 0, 0];
        order.forEach((letter, i) => { letterTimes[letter] += held[i]; });
        const word = resultWord(letterTimes, score);
        combo = score >= 95 ? combo + 1 : 0;
        const multiplier = combo >= 6 ? 1.5 : combo >= 3 ? 1.2 : 1;
        const earned = Math.round(score * multiplier);
        points += earned;
        bestCombo = Math.max(bestCombo, combo);
        words.push(word);
        const caption = document.querySelector(".caption");
        if (score > 0) {
          playEom();
          deadline += 1500;
          caption.textContent = captions[successes % captions.length];
          successes++;
          caption.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160 });
        } else {
          caption.textContent = "";
        }
        showResult(word, score, combo, multiplier, earned);
        changeRound();
      } else {
        moveMarker(index);
        cells[index].setAttribute("aria-current", "step");
      }
    }

    window.addEventListener("keyup", event => {
      if (event.code === inputOwner) finishHold();
    });
    window.addEventListener("blur", finishHold);
  </script>
</body>
</html>
