  :root { --ui-font: Pretendard, system-ui, sans-serif; font-family: var(--ui-font); }

  html, body { margin: 0; height: 100%; overflow: hidden; background: #080c16; touch-action: none; }
  main {
    position: fixed;
    left: 50%;
    top: 0;
    --yo-size: 88px;
    --letter-size: calc(var(--yo-size) * .7);
    width: calc(var(--yo-size) * 8);
    height: 100%;
    transform-origin: top center;
    background: #10182e;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: grab;
  }
  main:active { cursor: grabbing; }
  .flow {
    position: absolute;
    top: -192px;
    width: 100%;
    height: calc(100% + 192px);
    pointer-events: none;
    animation: descend 0.64s linear infinite;
  }
  @keyframes descend { to { transform: translateY(192px); } }
  #yo {
    position: absolute;
    left: 50%;
    top: 58%;
    transform: translate(-50%, -50%);
    color: #b3b5bd;
    font: 800 var(--yo-size)/1 var(--ui-font);
    pointer-events: none;
  }
  #yo { width: 1em; text-align: center; }
  .trail {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .spark { position: absolute; width: 4px; height: 4px; border-radius: 50%; pointer-events: none;
    background: currentColor; animation: spark-out .28s ease-out forwards; }
  @keyframes spark-out {
    from { opacity: .82; transform: translate(-50%, -50%) scale(1); }
    to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4); }
  }
  #drag-hint {
    position: absolute; inset-inline: 0; bottom: 12%; margin: 0;
    color: #b7c1d1; font-size: 24px; font-weight: 600;
    text-align: center; pointer-events: none;
  }
  #drops { position: absolute; inset: 0; pointer-events: none; }
  .drop {
    position: absolute;
    top: 0;
    font: 700 var(--letter-size)/1 var(--ui-font);
    color: #c1d5d8;
    pointer-events: none;
  }
  .danger { color: #ef9e9a; }
  .drop.finish { color: #75adff; }
  #letters {
    fill: #bcc6d2;
    font: 700 var(--letter-size)/1 var(--ui-font);
    white-space: pre;
  }
  .screen {
    position: absolute; inset: 0; overflow: auto;
    display: flex; flex-direction: column; align-items: center;
    box-sizing: border-box; padding: 40px;
    color: #e5e8ef; background: #10182ef5; cursor: default;
    text-align: center;
  }
  .screen[hidden] { display: none; }
  .panel { margin: auto; width: 100%; max-width: 540px; }
  h1, #result { margin: 0; font-weight: 800; letter-spacing: -.055em; }
  h1 { font-size: 98px; }
  .rules { margin: 34px 0; color: #b7c1d1; font-size: 24px; line-height: 1.65; }
  .screen button {
    border: 1px solid #96a6bd; border-radius: 8px; padding: 15px 38px;
    background: #dce3ed; color: #131d32; font: 700 25px var(--ui-font); cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #75adff; outline-offset: 5px; }
  #over strong { font-size: 26px; color: #ef9e9a; }
  #over.finished::before { content: ""; flex: 0 0 calc(54% + 76px); }
  #over.finished .panel { margin: 0 auto; }
  #over.finished #result {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    margin: 0; overflow: hidden; font-size: 104px; line-height: 1.25;
  }
  #score { margin-bottom: 22px; font-size: 22px; }
  #score-total { font-weight: 800; font-size: 36px; }
  .screen #open-scoring {
    display: block; margin: 12px auto 0; padding: 7px 12px; background: transparent;
    border: 0; color: #99a6bb; font-size: 16px; font-weight: 400;
  }
  .screen #open-scoring:is(:hover, :focus-visible) { text-decoration: underline; }
  #scoring {
    box-sizing: border-box; width: min(420px, 90vw); max-height: 85dvh;
    border: 1px solid #54627a; border-radius: 14px; padding: 24px;
    background: #172139; color: #e5e8ef; font: 16px/1.55 var(--ui-font);
    overflow: auto; touch-action: pan-y;
  }
  #scoring::backdrop { background: #050913ba; }
  #scoring h2 { margin: 0; font-size: 22px; }
  #scoring ul { padding-left: 1.3em; }
  #scoring button { font: inherit; border: 1px solid #8090a8; border-radius: 6px;
    padding: 6px 18px; color: inherit; background: transparent; cursor: pointer; }
  .result-track {
    display: flex; width: max-content; margin-left: calc(50% - .5em);
    transition: transform 110ms ease-out;
  }
  #over.finished #result.assembled {
    top: 3%; height: 54%; transform: none; display: grid;
    align-items: center; overflow: visible; max-width: none;
  }
  .assembled .result-track {
    justify-self: center; justify-content: center; flex-wrap: wrap;
    margin: 0; line-height: 1.15; transition: none;
  }
  .result-track span { width: 1em; text-align: center; letter-spacing: 0; }
  @media (prefers-reduced-motion: reduce) { .result-track { transition: none; } }
  .credit { font-size: 18px; color: #a1afc4; }
  #result { margin: 18px 0 42px; font-size: 76px; line-height: 1.12; overflow-wrap: anywhere; }

<body>
<main aria-label="화면을 누른 채 좌우로 끌어 요를 움직이세요">
  <svg class="flow" aria-hidden="true">
    <defs>
      <pattern id="streaks" width="144" height="192" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="#1b243a" style="stroke-dasharray: var(--streak-fill, .333333) 2">
        <path d="M9.5 7v21" pathLength="1"/>
        <path d="M9.5 114v28.5" pathLength="1"/>
        <path d="M33.5 54v31.5" pathLength="1"/>
        <path d="M33.5 152v18" pathLength="1"/>
        <path d="M57.5 31v18" pathLength="1"/>
        <path d="M57.5 137v24" pathLength="1"/>
        <path d="M81.5 79v27" pathLength="1"/>
        <path d="M81.5 177v15" pathLength="1"/>
        <path d="M105.5 14v30" pathLength="1"/>
        <path d="M105.5 103v19.5" pathLength="1"/>
        <path d="M129.5 61v19.5" pathLength="1"/>
        <path d="M129.5 146v33" pathLength="1"/>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#streaks)"/>
  </svg>
  <div id="drops"></div>
  <svg class="trail" aria-hidden="true">
    <defs>
      <linearGradient id="mist" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="0" y2="240">
        <stop stop-color="#b3b5bd" stop-opacity=".48"/>
        <stop offset="1" stop-color="#b3b5bd" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <g fill="none" stroke-width="15" stroke="url(#mist)" stroke-linejoin="round" stroke-linecap="round">
      <path id="wake"/>
      <use href="#wake" stroke-width="23" opacity=".18"/>
      <g id="letters" stroke="none" text-anchor="middle" dominant-baseline="central"></g>
    </g>
  </svg>
  <span id="yo">요</span>
  <p id="drag-hint" hidden><span aria-hidden="true">←</span> 여기를 좌우로 드래그 <span aria-hidden="true">→</span></p>
  <section id="intro" class="screen" aria-labelledby="title">
    <div class="panel">
      <h1 id="title">요~~~~이</h1>
      <p class="credit">feat. 케이 스텔라리아</p>
      <p class="rules">요를 좌우로 드래그하면서 요~이를 완성하자.<br><b class="danger">쉣</b>에 닿으면 게임 오버! 누구보다 긴 요이를 만들어보자!</p>
      <button type="button" id="start">시작하기</button>
    </div>
  </section>
  <section id="over" class="screen" aria-label="게임 결과" hidden>
    <div class="panel">
      <strong id="outcome">게임 오버</strong>
      <p id="result"></p>
      <div id="score" hidden>
        <div id="score-total"></div>
      </div>
      <button type="button" id="retry">다시 하기</button>
      <button type="button" id="share">결과 공유</button>
      <a id="card-download" download="yoi-result.png" hidden>결과 이미지 저장</a>
      <textarea id="share-copy" aria-label="복사할 공유 문구" readonly hidden></textarea>
      <button type="button" id="open-scoring" aria-haspopup="dialog">채점 기준 확인</button>
    </div>
  </section>
  <a class="brand" href="https://ameno.cc/" aria-label="아메노리카 홈페이지"><svg class="ameno-rule" viewBox="0 0 17.5 100" preserveAspectRatio="none" aria-hidden="true"><rect x="0" y="20" width="1" height="60"/><rect x="5.5" y="0" width="1" height="100"/><rect x="11" y="40" width="1" height="60"/><rect x="16.5" y="60" width="1" height="40"/></svg><span>AmenoRica</span></a>
</main>
      <dialog id="scoring" aria-labelledby="scoring-title">
        <h2 id="scoring-title">채점 기준</h2>
        <p>첫 ‘요’는 ‘호’로 계산해. 마지막 ‘이’는 제외!</p>
        <ul>
          <li>개수 · 많이 모을수록 고득점</li>
          <li>균형 · 호와 ~가 반반에 가까울수록 고득점</li>
          <li>연속 · 같은 글자가 길게 이어질수록 고득점</li>
          <li>패턴 · 호와 ~가 섞인 가장 긴 반복 구간</li>
        </ul>
      <form method="dialog"><button autofocus>닫기</button></form>
      </dialog>
<script>
  const stage = document.querySelector('main');
  const yo = document.querySelector('#yo');
  let activePointer = null;
  let lastX = 0;

  let scale, fieldWidth, fieldHeight, playerSize, letterSize;
  let playerX;
  const dropSizes = new Map();
  function fitStage() {
    fieldWidth = stage.clientWidth;
    scale = Math.min(1, document.documentElement.clientWidth / fieldWidth);
    fieldHeight = document.documentElement.clientHeight / scale;
    playerSize = yo.offsetWidth;
    letterSize = parseFloat(getComputedStyle(document.querySelector('#letters')).fontSize);
    playerX ??= fieldWidth / 2;
    stage.style.height = (document.documentElement.clientHeight / scale) + 'px';
    stage.style.transform = 'translateX(-50%) scale(' + scale + ')';
  }
  fitStage();
  document.fonts.ready.then(() => dropSizes.clear());
  window.addEventListener('resize', fitStage);

  const wake = document.querySelector('#wake');
  const samples = [];
  const flow = document.querySelector('.flow').getAnimations()[0];
  const drops = document.querySelector('#drops');
  const suffix = document.querySelector('#letters');
  const over = document.querySelector('#over');
  const dragHint = document.querySelector('#drag-hint');
  const intro = document.querySelector('#intro');
  const retry = document.querySelector('#retry');
  let playing = false;
  let collected = '';
  let speed = 1;
  let travelled = 0;
  let untilDrop = 0;
  let lag = 0;
  let lagVelocity = 0;
  let ending = false;
  let lastFrame;
  let dropsUntilFinish = 0;

  function setSpeed(value) {
    speed = value;
    flow.playbackRate = speed;
    stage.style.setProperty('--streak-fill', speed / 3);
  }

  function attachLetter(value) {
    const letter = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    letter.textContent = value;
    letter.style.display = 'none';
    suffix.append(letter);
  }

  let visibleLetters = 0;
  function positionLetters(headY) {
    const letters = suffix.children;
    const last = samples.length - 1;
    const head = samples[last];
    const length = head.arc - samples[0].arc;
    let segment = last;
    // Glyph edges and centres are visited in increasing distance from the head.
    function pointAt(distance) {
      const arc = head.arc - Math.min(distance, length);
      while (segment > 1 && samples[segment - 1].arc > arc) segment--;
      const a = samples[segment], b = samples[Math.max(0, segment - 1)];
      const t = (a.arc - arc) / (a.arc - b.arc || 1);
      return { x: a.x + t * (b.x - a.x), y: travelled - a.at + t * (a.at - b.at) };
    }
    let index = 0, offset = 0;
    let before = { x: head.x, y: 0 };
    for (; index < letters.length; index++) {
      const letter = letters[index];
      const step = letter.textContent === '~' ? letterSize * .65 : letterSize;
      if (offset + step / 2 > length || headY + before.y > fieldHeight + letterSize) break;
      const center = pointAt(offset + step / 2);
      offset += step;
      const after = pointAt(offset);
      const tangent = Math.atan2(after.y - before.y, after.x - before.x) * 180 / Math.PI;
      const angle = letter.textContent === '~' ? tangent : tangent - 90;
      if (index >= visibleLetters) letter.style.display = '';
      letter.setAttribute('transform', 'translate(' + center.x + ' ' + center.y + ') rotate(' + angle + ')');
      before = after;
    }
    for (let i = index; i < Math.min(visibleLetters, letters.length); i++) letters[i].style.display = 'none';
    visibleLetters = index;
  }

  function spawnDrop() {
    const item = document.createElement('span');
    const roll = Math.random();
    item.textContent = roll < .4 ? '쉣' : roll < .7 ? '호' : '~';
    if (collected.length >= 3) {
      if (dropsUntilFinish === 0) {
        item.textContent = '이';
        dropsUntilFinish = 7;
      } else {
        dropsUntilFinish--;
      }
    }
    item.className = item.textContent === '쉣' ? 'drop danger' : 'drop';
    if (item.textContent === '이') item.classList.add('finish');
    drops.append(item);
    let size = dropSizes.get(item.textContent);
    if (!size) {
      size = { width: item.offsetWidth, height: item.offsetHeight };
      dropSizes.set(item.textContent, size);
    }
    item.size = size;
    item.x = Math.random() * Math.max(0, fieldWidth - size.width);
    item.style.left = item.x + 'px';
    item.startDistance = travelled + size.height;
  }

  function scoreRun(collected) {
    const symbols = '호' + collected;
    const n = symbols.length;
    let balance = 0, streak = 0, longest = 0;
    for (let i = 0; i < n; i++) {
      balance += symbols[i] === '호' ? 1 : -1;
      streak = symbols[i] === symbols[i - 1] ? streak + 1 : 1;
      longest = Math.max(longest, streak);
    }
    const quantity = Math.ceil(n * (n + 1) / 4);
    const ratio = Math.max(0, n - 2 * Math.abs(balance));
    const run = 2 * longest;
    let bonus = 0;
    // For each period, count consecutive matches with the text one period ahead.
    for (let period = 2; period * 2 <= n; period++) {
      let matches = 0, firstRun = 0;
      for (let i = n - period - 1; i >= 0; i--) {
        firstRun = symbols[i] === symbols[i + 1] ? firstRun + 1 : 1;
        matches = symbols[i] === symbols[i + period] ? matches + 1 : 0;
        if (matches < period || firstRun >= period) continue;
        const copies = Math.floor(matches / period);
        bonus = Math.max(bonus, period * (copies + 1));
      }
    }
    return quantity + ratio + run + bonus;
  }

  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  function pickupBurst(x, y, finish) {
    if (reducedMotion.matches) return;
    const phase = Math.random() * Math.PI * 2;
    for (let i = 0; i < 5; i++) {
      const angle = phase + i * Math.PI * 2 / 5;
      const radius = 18 + Math.random() * 14;
      const dot = document.createElement('i');
      dot.className = 'spark';
      dot.setAttribute('aria-hidden', 'true');
      dot.style.left = x + 'px';
      dot.style.top = y + 'px';
      dot.style.color = finish ? '#90bfff' : '#c1d5d8';
      dot.style.setProperty('--dx', Math.cos(angle) * radius + 'px');
      dot.style.setProperty('--dy', Math.sin(angle) * radius + 'px');
      dot.onanimationend = () => dot.remove();
      stage.insertBefore(dot, yo);
    }
  }

  function advanceDrops(distance, playerY) {
    if (playing) untilDrop -= distance;
    if (playing && untilDrop <= 0) {
      spawnDrop();
      untilDrop += 150 + Math.random() * 100;
    }
    for (let item = drops.firstElementChild, next; item; item = next) {
      next = item.nextElementSibling;
      const y = travelled - item.startDistance;
      item.style.transform = 'translateY(' + y + 'px)';
      if (y > fieldHeight) { item.remove(); continue; }
      if (!playing) continue;
      const hitRadius = playerSize * .34;
      if (item.x + item.size.width < playerX - hitRadius || item.x > playerX + hitRadius ||
          y + item.size.height < playerY - hitRadius || y > playerY + hitRadius) continue;
      const finished = item.textContent === '이';
      if (item.textContent !== '쉣') {
        lagVelocity = Math.min(230, lagVelocity + 195);
        pickupBurst(item.x + item.size.width / 2, y + item.size.height / 2, finished);
      }
      if (finished || item.textContent === '쉣') {
        playing = false;
        ending = true;
        activePointer = null;
        if (!finished) {
          flow.pause();
          collected = '';
          suffix.replaceChildren();
        }
        const result = document.querySelector('#result');
        const word = finished ? '요' + collected + '이' : '쉣!';
        result.textContent = finished ? '' : word;
        document.querySelector('#score').hidden = !finished;
        if (finished) {
          document.querySelector('#score-total').textContent = scoreRun(collected) + '점';
        }
        over.classList.toggle('finished', finished);
        over.querySelector('strong').hidden = finished;
        prepareShareCard(finished ? word + '!' : '쉐엣!', finished ? document.querySelector('#score-total').textContent : '게임 오버');
        if (finished) {
          attachLetter('이');
          item.remove();
        }
        const showResult = () => {
          flow.pause();
          over.hidden = false;
          retry.focus();
          readResult(word);
        };
        if (finished) window.setTimeout(showResult, 650);
        else showResult();
        return;
      }
      collected += item.textContent;
      attachLetter(item.textContent);
      setSpeed(Math.min(5, 1 + collected.length * .16));
      item.remove();
    }
  }

  function frame(now) {
    const dt = Math.min((now - (lastFrame ?? now)) / 1000, .05);
    lastFrame = now;
    if ((playing || ending) && over.hidden) {
      // A pickup gives the player a backward impulse. Critical damping settles it without bouncing.
      const decay = Math.exp(-6 * dt);
      const restoringVelocity = lagVelocity + 6 * lag;
      const nextLag = (lag + restoringVelocity * dt) * decay;
      lagVelocity = (lagVelocity - 6 * restoringVelocity * dt) * decay;
      const baseVelocity = 300 * speed;
      const distance = dt * baseVelocity;
      lag = nextLag;
      yo.style.translate = '0 ' + lag.toFixed(2) + 'px';
      travelled += distance;
      const playerY = fieldHeight * .58 + lag;
      const headY = playerY + playerSize * .38;
      const prior = samples[samples.length - 1];
      const arc = prior ? prior.arc + Math.hypot(playerX - prior.x, travelled - prior.at) : 0;
      // A straight vertical run only needs its endpoints for both trail and glyph placement.
      if (samples.length >= 2 && prior.x === playerX && samples[samples.length - 2].x === playerX) {
        prior.at = travelled;
        prior.arc = arc;
      } else {
        samples.push({ x: playerX, at: travelled, arc });
      }
      const depth = Math.max(240, fieldHeight - headY + letterSize);
      while (samples.length > 2 && travelled - samples[1].at > depth) samples.shift();
      let path = '';
      for (let i = samples.length - 1; i >= 0; i--) {
        const point = samples[i];
        path += (path ? 'L' : 'M') + point.x.toFixed(2) + ' ' + (travelled - point.at).toFixed(2);
        if (travelled - point.at >= 240) break;
      }
      wake.parentNode.setAttribute('transform', 'translate(0 ' + headY + ')');
      wake.setAttribute('d', path);
      advanceDrops(distance, playerY);
      positionLetters(headY);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  }

  const riseDuration = 3 * secondsPerBeat;

  function synthesizeSyllable(syllable, duration, accent, phraseStart, leadsIntoEnding) {
    const rate = 24000;
    const [encoded, loopStart, loopEnd] = keiVocals[syllable];
    if (!decodedVocals.has(syllable)) {
      const bytes = atob(encoded);
      const pcm = new Int16Array(bytes.length / 2);
      for (let j = 0; j < pcm.length; j++) {
        pcm[j] = bytes.charCodeAt(2 * j) | bytes.charCodeAt(2 * j + 1) << 8;
      }
      decodedVocals.set(syllable, pcm);
    }
    const pcm = decodedVocals.get(syllable);
    const buffer = audioContext.createBuffer(1, Math.round(duration * rate), rate);
    const out = buffer.getChannelData(0);
    const overlap = 360;
    const isEnding = syllable === '이';
    // Skip the quiet lead-in so the ending vowel joins the preceding note.
    let pos = isEnding ? Math.round(.040 * rate) : 0;
    const baseStep = isEnding ? endingHz / 280 : syllable === '호' && accent ? 1.04 : 1;
    const glideEnd = duration - secondsPerBeat - joinTime;
    const glideLength = Math.min(.20, duration * .60);
    const releaseHz = syllable === '호' ? 284 : 305;
    const landingShift = 12 * Math.log2(endingHz / (releaseHz * baseStep));
    for (let j = 0; j < out.length; j++) {
      const k = Math.floor(pos);
      const frac = pos - k;
      let value = pcm[k] + frac * (pcm[k + 1] - pcm[k]);
      if (pos >= loopEnd - overlap) {
        const mix = (pos - loopEnd + overlap) / overlap;
        const other = loopStart + k - loopEnd + overlap;
        const next = pcm[other] + frac * (pcm[other + 1] - pcm[other]);
        value += mix * (next - value);
      }
      // Reaccent the sustained vowel once, then close it sharply: 쉐엣!
      const progress = j / out.length;
      let emphasis = 1;
      let exclamationLift = 0;
      if (syllable === '쉣') {
        const dip = Math.exp(-(((progress - .61) / .075) ** 2));
        const stress = Math.exp(-(((progress - .80) / .095) ** 2));
        emphasis = 1 - .40 * dip + .28 * stress;
        exclamationLift = 2.8 * stress;
      }
      const releaseSamples = syllable === '쉣' ? 145 : 840;
      const fade = Math.min(1, j / 144, (out.length - 1 - j) / releaseSamples);

      const t = leadsIntoEnding ? Math.max(0, Math.min(1, 1 + (elapsed - glideEnd) / glideLength)) : 0;
      const glide = t * t * (3 - 2 * t);
      pos += baseStep * 2 ** ((semitones + endingLift + exclamationLift + glide * landingShift) / 12);

  let resultAnimation;
  let resultObserver;

  function assembleResult(result, track) {
    const glyphs = Array.from(track.children);
    const origins = glyphs.map(glyph => glyph.getBoundingClientRect());
    result.classList.add('assembled');
    track.style.transform = 'none';
    function fitWord() {
      const width = result.clientWidth * .92;
      const height = result.clientHeight;
      const count = glyphs.length;
      const readingSize = parseFloat(getComputedStyle(result).fontSize);
      let size = Math.min(readingSize, width);
      // Find the largest type that fits all rows, including the short last row.
      let columns = count;
      for (let cols = 1, best = 0; cols <= count; cols++) {
        const candidate = Math.min(readingSize, width / cols, height / (1.15 * Math.ceil(count / cols)));
        if (candidate >= best) { best = candidate; size = candidate; columns = cols; }
      }
      size = Math.max(.01, Math.floor(size * 64) / 64);
      track.style.fontSize = size + 'px';
      track.style.width = (columns * size + .02) + 'px';
    }
    fitWord();
    resultObserver = new ResizeObserver(fitWord);
    resultObserver.observe(result);
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const bounds = result.getBoundingClientRect();
    const targets = glyphs.map(glyph => glyph.getBoundingClientRect());
    const scale = bounds.width / result.clientWidth;
    glyphs.forEach((glyph, index) => {
      const from = origins[index], to = targets[index];
      // Letters already scrolled off the ticker re-enter at its left edge.
      const x = Math.max(bounds.left, from.left + from.width / 2);
      const dx = (x - to.left - to.width / 2) / scale;
      const dy = (from.top + from.height / 2 - to.top - to.height / 2) / scale;
      glyph.animate([
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + from.width / to.width + ')' },
        { transform: 'none' }
      ], { duration: 450, delay: index * Math.min(80, 1800 / glyphs.length),
           easing: 'cubic-bezier(.22,.68,.22,1)', fill: 'backwards' });
    });
  }

  function readResult(word) {
    let phraseTime = 0;
    let hoCount = 0;
    const cues = [];
    const groups = word.match(/[요호이쉣]~*/g) || [];
    const notes = groups.map((group, index) => {
      const syllable = group[0];
      const leadsIntoEnding = groups[index + 1] === '이';
      const beats = syllable === '쉣' ? 1.55 : syllable === '호' ? .75 : syllable === '이' ? 1 : 2;
      const carriedVowel = leadsIntoEnding ? secondsPerBeat + joinTime : 0;
      const duration = (beats + (group.length - 1) * .5) * secondsPerBeat + carriedVowel;
      const start = syllable === '이' ? Math.max(0, phraseTime - joinTime) : phraseTime;
      cues.push({ letter: syllable, at: start });
      for (let i = 1; i < group.length; i++) {
        cues.push({ letter: '~', at: start + (beats + (i - 1) * .5) * secondsPerBeat });
      }
      const buffer = audioContext && synthesizeSyllable(syllable, duration, syllable === '호' && hoCount++ % 2 === 0, start, leadsIntoEnding);
      phraseTime = start + (buffer ? buffer.duration : duration);
      return { start, buffer };
    });
    const clock = audioContext && audioContext.state === 'running'
      ? () => audioContext.currentTime : () => performance.now() / 1000;
    const audioStart = (audioContext?.currentTime ?? 0) + .025;
    const visualStart = audioContext?.state === 'running' ? audioStart : clock() + .025;
    if (word.startsWith('요')) {
      const track = document.createElement('span');
      track.className = 'result-track';
      const result = document.querySelector('#result');
      result.replaceChildren(track);
      let next = 0;
      function reveal() {
        const elapsed = clock() - visualStart;
        while (next < cues.length && (next === 0 || cues[next].at <= elapsed)) {
          const glyph = document.createElement('span');
          glyph.textContent = cues[next].letter;
          track.append(glyph);
          track.style.transform = 'translateX(-' + next + 'em)';
          next++;
        }
        if (next < cues.length || elapsed < phraseTime) {
          resultAnimation = requestAnimationFrame(reveal);
        } else {
          assembleResult(result, track);
        }
      }
      reveal();
    }
    if (!audioContext) return;
    for (const { start, buffer } of notes) {
      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(audioContext.destination);
      liveSources.add(source);
      source.onended = () => {
        liveSources.delete(source);
        source.disconnect();
      };
      source.start(audioStart + start);
    }
  }

  function startRound() {
    cancelAnimationFrame(resultAnimation);
    resultObserver?.disconnect();
    const result = document.querySelector('#result');
    result.classList.remove('assembled');
    result.replaceChildren();
    stopReading();
    prepareVoice();
    shareButton.textContent = '결과 공유';
    shareCopy.hidden = true;
    cardDownload.hidden = true;
    if (cardDownload.hasAttribute('href')) URL.revokeObjectURL(cardDownload.href);
    cardDownload.removeAttribute('href');
    intro.hidden = true;
    over.hidden = true;
    ending = false;
    lag = lagVelocity = 0;
    yo.style.translate = '';
    drops.replaceChildren();
    suffix.replaceChildren();
    collected = '';
    setSpeed(1);
    dropsUntilFinish = 0;
    untilDrop = travelled = 0;
    samples.length = 0;
    visibleLetters = 0;
    playerX = fieldWidth / 2;
    yo.style.left = '50%';
    wake.removeAttribute('d');
    flow.pause();
    playing = false;
    dragHint.hidden = false;
  }
  document.querySelector('#start').onclick = startRound;
  retry.onclick = startRound;
  const shareButton = document.querySelector('#share');
  const shareCopy = document.querySelector('#share-copy');
  const cardDownload = document.querySelector('#card-download');

  function prepareShareCard(word, outcome) {
    const canvas = document.createElement('canvas');
    canvas.width = 1080;
    canvas.height = 720;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    ctx.fillStyle = '#10182e';
    ctx.fillRect(0, 0, 1080, 720);
    ctx.fillStyle = '#1d2a43';
    for (let x = 24; x < 1080; x += 40) {
      for (let y = (x * 7) % 113 - 80; y < 720; y += 113) {
        ctx.fillRect(x, y, 2, 44);
      }
    }
    ctx.fillStyle = '#aab9ce';
    ctx.font = '600 38px Pretendard, sans-serif';
    ctx.fillText('#요__이', 64, 88);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const chars = Array.from(word);
    const size = Math.min(144, Math.sqrt(920 * 330 / chars.length) * .84);
    ctx.font = '800 ' + size + 'px Pretendard, sans-serif';
    const perLine = Math.max(1, Math.floor(920 / Math.max(...Array.from(new Set(chars), c => ctx.measureText(c).width))));
    const rows = Math.ceil(chars.length / perLine);
    ctx.fillStyle = '#e5e8ef';
    for (let i = 0; i < rows; i++) {
      const line = chars.slice(i * perLine, (i + 1) * perLine).join('');
      ctx.fillText(line, 540, 310 + (i - (rows - 1) / 2) * size * 1.12, 952);
    }
    ctx.font = '800 76px Pretendard, sans-serif';
    ctx.fillStyle = outcome === '게임 오버' ? '#ef9e9a' : '#9cbfff';
    ctx.fillText(outcome, 540, 550);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#aab9ce';
    ctx.font = '400 32px AmenoBrand, sans-serif';
    ctx.fillText('AmenoRica', 1016, 658);
    canvas.toBlob(blob => {
      if (!blob || !ending) return;
      cardDownload.href = URL.createObjectURL(blob);
      cardDownload.hidden = false;
    }, 'image/png');
  }

  shareButton.onclick = async () => {
    const finished = over.classList.contains('finished');
    const outcome = finished ? document.querySelector('#score-total').textContent : '게임 오버';
    const word = finished ? '요' + collected + '이' : '쉐엣';
    const hosted = /^https?:$/.test(location.protocol) && !['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
    const url = hosted ? location.origin + location.pathname : document.querySelector('.brand').href;
    const message = [
      '#요__이',
      `요~~이 게임에서 ${outcome}!`,
      `"${word}!"`,
      '',
      '기이이일쭉한 요~이를 만들어보자!',
      url
    ].join('\n');
    const data = { text: message };
    if (navigator.share) {
      try { await navigator.share(data); return; }
      catch (error) { if (error.name === 'AbortError') return; }
    }
    try {
      await navigator.clipboard.writeText(message);
      shareButton.textContent = '복사했어!';
    } catch {
      shareCopy.value = message;
      shareCopy.hidden = false;
      shareCopy.focus();
      shareCopy.select();
    }
  };
  document.querySelector('#open-scoring').onclick = () => document.querySelector('#scoring').showModal();

  function moveBy(distance) {
    const half = playerSize / 2;
    playerX = Math.max(half, Math.min(fieldWidth - half, playerX + distance / scale));
    yo.style.left = playerX + 'px';
  }

  document.body.onpointerdown = event => {
    if (!intro.hidden || ending || activePointer !== null || event.button !== 0) return;
    if (!playing) {
      lastFrame = undefined;
      dragHint.hidden = true;
      playing = true;
      flow.play();
    }
    activePointer = event.pointerId;
    lastX = event.clientX;
    document.body.setPointerCapture(activePointer);
  };

  function follow(event) {
    if (event.pointerId !== activePointer) return;
    moveBy(event.clientX - lastX);
    lastX = event.clientX;
  }

  document.body.onpointermove = follow;
  document.body.onpointerup = event => {
    if (event.pointerId !== activePointer) return;
    follow(event);
    activePointer = null;
  };
  document.body.onpointercancel = document.body.onlostpointercapture = event => {
    if (event.pointerId === activePointer) activePointer = null;
  };
</script>
</body>
</html>
